name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extensions:
    name: Browser extensions
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            extensions/chrome/pnpm-lock.yaml
            extensions/firefox/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C extensions/chrome install --frozen-lockfile
          pnpm -C extensions/firefox install --frozen-lockfile

      - name: Verify release metadata
        run: |
          pnpm version:check
          pnpm icons:check
          node scripts/check-release.mjs "$TAG"

      - name: Lint and type-check extensions
        run: |
          pnpm lint
          pnpm -C extensions/chrome run type-check
          pnpm -C extensions/firefox run type-check

      - name: Build extensions
        run: |
          pnpm build:chrome
          pnpm build:firefox

      - name: Package extension artifacts
        run: |
          pnpm package:chrome
          pnpm package:firefox

      - name: Sign Firefox XPI with AMO
        if: env.AMO_API_KEY != '' && env.AMO_API_SECRET != ''
        run: |
          pnpm dlx web-ext@latest sign \
            --source-dir extensions/firefox/dist \
            --artifacts-dir artifacts \
            --channel unlisted \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET"

      - name: Upload extension bundles
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            server/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C server install --frozen-lockfile
          pnpm -C desktop install --frozen-lockfile

      - name: Verify release metadata
        shell: bash
        run: node scripts/check-release.mjs "$TAG"

      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK_SECRET" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK_SECRET: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD_SECRET: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CSC_LINK_SECRET" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm -C desktop run dist:win

      - name: Build macOS disk images
        if: runner.os == 'macOS'
        run: pnpm -C desktop run dist:mac

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: pnpm -C desktop run dist:linux

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [extensions, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          find . -maxdepth 2 -type f ! -name "SHA256SUMS.txt" -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed 's#  \./#  #' > ../SHA256SUMS.txt

      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.xpi

      - name: Build release notes
        run: |
          VERSION="${TAG#v}"
          node scripts/changelog-section.mjs "$VERSION" > release-notes.md
          {
            echo ""
            echo "SHA-256 checksums for every artifact are attached as \`SHA256SUMS.txt\`."
          } >> release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(
            "$TAG"
            release-assets/*
            SHA256SUMS.txt
            --title "Media Launcher ${TAG#v}"
            --notes-file release-notes.md
          )
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
